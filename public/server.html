<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Emoji Anzeige</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    .emoji {
      position: absolute;
      font-size: 2em;
      animation: fall 7s linear forwards;
      pointer-events: none;
    }
    @keyframes fall {
      0%   { top: -50px; opacity: 1; }
      100% { top: 150vh; opacity: 0; }
    }
  </style>
</head>
<body>
  <script src="/socket.io/socket.io.js"></script>
  <script src="emoji.js"></script>
</body>
</html>
